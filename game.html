<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mot Thoi Ky Niem</title>
<link rel="stylesheet" href="assets/web/ui/style.css">
</head>
<body>
<div id="app">
<div id="man-hinh-dang-nhap" class="man-hinh">
<h1>Mot Thoi Ky Niem</h1>
<p class="phu-de">Bản dựng lại (code gốc) — máy chủ Node.js thuần</p>
<form id="form-dang-nhap">
<input id="dn-ten" placeholder="Tên tài khoản" autocomplete="username">
<input id="dn-mk" type="password" placeholder="Mật khẩu" autocomplete="current-password">
<button type="submit">Đăng nhập</button>
</form>
<p id="dn-loi" class="loi"></p>
<p class="goi-y">Tài khoản đầu tiên là quản trị. Tạo tài khoản: node quan-tri.js them &lt;ten&gt; &lt;mat-khau&gt;</p>
</div>
<div id="man-hinh-nhan-vat" class="man-hinh" hidden>
<h2>Chọn nhân vật</h2>
<div id="danh-sach-nv"></div>
<form id="form-tao-nv">
<input id="tn-ten" placeholder="Tên nhân vật" maxlength="12">
<select id="tn-phai">
<option>Thiếu Lâm</option><option>Thiên Vương</option><option>Nga My</option><option>Thủy Yên</option><option>Ngũ Độc</option><option>Đường Môn</option><option>Côn Lôn</option><option>Võ Đang</option><option>Cái Bang</option><option>Thiên Nhẫn</option>
</select>
<button type="submit">Tạo nhân vật</button>
</form>
</div>
<div id="man-hinh-game" hidden>
<canvas id="game" width="960" height="600"></canvas>
<div id="hud">
<div id="hud-ten"></div>
<div id="hud-cap"></div>
<div id="hud-hp"></div>
<div id="hud-mp"></div>
<div id="hud-exp"></div>
<div id="hud-tien"></div>
</div>
<div id="chat"></div>
<form id="form-chat">
<input id="chat-vao" placeholder="Nhắn...">
<button type="submit">Gửi</button>
</form>
<button id="nut-auto">Tự động: Tắt</button>
<button id="nut-am-thanh">Âm thanh: Bật</button>
</div>
</div>
<script>
(function () {
  // Du phong: neu main.js chua chay, form van dang nhap duoc va bao loi ro rang.
  // main.js se gan window.__dnDaGan khi no chay de tranh gan handler 2 lan.
  function hienLoi(msg) { var loi = document.getElementById("dn-loi"); if (loi) loi.textContent = msg; }
  function hienManHinh(ten) { ["man-hinh-dang-nhap", "man-hinh-nhan-vat", "man-hinh-game"].forEach(function (id) { var el = document.getElementById(id); if (el) el.hidden = id !== ten; }); }
  var form = document.getElementById("form-dang-nhap");
  if (form) form.addEventListener("submit", function (e) {
    if (window.__dnDaGan) return;
    e.preventDefault();
    var ten = document.getElementById("dn-ten").value.trim();
    var mk = document.getElementById("dn-mk").value;
    fetch("/api/dang-nhap", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ten: ten, matKhau: mk }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok || !x.d.dangNhap) { hienLoi(x.d.loi || "sai ten hoac mat khau"); return; }
        return fetch("/api/trang-thai").then(function (r) { return r.json(); }).then(function (tt) {
          if (tt.dangNhap) {
            if (window.VL) { window.VL.taiDanhSachNv(); window.VL.hienManHinh("man-hinh-nhan-vat"); }
            else hienManHinh("man-hinh-nhan-vat");
          } else hienLoi("sai ten hoac mat khau");
        });
      })
      .catch(function (err) { hienLoi(err.message || String(err)); });
  });
  // Chan doan: sau 5 giay ma main.js van chua chay (window.VL chua co)
  // thi bao ro cho nguoi dung thay vi im lang nhu truoc.
  // Neu import module loi, hien loi that (window.__loiTaiModule) thay vi thong bao chung.
  setTimeout(function () {
    if (!window.VL) hienLoi(window.__loiTaiModule || "Game chua tai duoc (main.js khong chay). Hay tai lai trang; neu van loi, bao lai de kiem tra mang/may chu.");
  }, 5000);
})();
</script>

</body>
</html>
