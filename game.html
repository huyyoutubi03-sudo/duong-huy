<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duong Huy</title>
<link rel="stylesheet" href="assets/web/ui/style.css">
</head>
<body>
<div id="app">
  <div id="man-hinh-dang-nhap" class="man-hinh">
    <h1>Duong Huy</h1>
    <p class="phu-de">Bản dựng lại (code gốc) — máy chủ Node.js thuần</p>
    <form id="form-dang-nhap">
      <input id="dn-ten" placeholder="Tên tài khoản" autocomplete="username">
      <input id="dn-mk" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
    </form>
    <p id="dn-loi" class="loi"></p>
    <p class="goi-y">Tài khoản đầu tiên là quản trị. Tạo tài khoản: node quan-tri.js them &lt;ten&gt; &lt;mat-khau&gt;</p>
  </div>
  <div id="man-hinh-nhan-vat" class="man-hinh" hidden>
    <h2>Chọn nhân vật</h2>
    <div id="danh-sach-nv"></div>
    <form id="form-tao-nv">
      <input id="tn-ten" placeholder="Tên nhân vật" maxlength="12">
      <select id="tn-phai">
        <option>Thiếu Lâm</option><option>Thiên Vương</option><option>Nga My</option><option>Thủy Yên</option><option>Cái Bang</option><option>Đường Môn</option><option>Ngũ Độc</option><option>Minh Giáo</option><option>Võ Đang</option><option>Côn Lôn</option>
      </select>
      <button type="submit">Tạo nhân vật</button>
    </form>
  </div>
  <div id="man-hinh-game" hidden>
    <canvas id="game" width="960" height="600"></canvas>
    <div id="hud">
      <div id="hud-ten"></div>
      <div class="thanh"><div id="thanh-mau" class="mau"></div></div>
      <div class="thanh"><div id="thanh-mana" class="mana"></div></div>
      <div id="hud-thong-tin"></div>
    </div>
    <div id="thanh-ky-nang"></div>
    <div id="chat"><div id="chat-noi-dung"></div><input id="chat-nhap" placeholder="Nhắn..."></div>
  </div>
</div>
<script type="module" src="src/game/main.js"></script>
</body>
</html>
