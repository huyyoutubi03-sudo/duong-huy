<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mot Thoi Ky Niem</title>
<link rel="stylesheet" href="assets/web/ui/style.css">
</head>
<body>
<div id="app">
  <div id="man-hinh-dang-nhap" class="man-hinh">
    <h1>Mot Thoi Ky Niem</h1>
    <p class="phu-de">Bản dựng lại (code gốc) — máy chủ Node.js thuần</p>
    <form id="form-dang-nhap">
      <input id="dn-ten" placeholder="Tên tài khoản" autocomplete="username">
      <input id="dn-mk" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
    </form>
    <p id="dn-loi" class="loi"></p>
    <p class="goi-y">Tài khoản đầu tiên là quản trị. Tạo tài khoản: node quan-tri.js them &lt;ten&gt; &lt;mat-khau&gt;</p>
  </div>
  <div id="man-hinh-nhan-vat" class="man-hinh" hidden>
    <h2>Chọn nhân vật</h2>
    <div id="danh-sach-nv"></div>
    <form id="form-tao-nv">
      <input id="tn-ten" placeholder="Tên nhân vật" maxlength="12">
      <select id="tn-phai">
        <option>Thiếu Lâm</option><option>Thiên Vương</option><option>Nga My</option><option>Thủy Yên</option><option>Cái Bang</option><option>Đường Môn</option><option>Ngũ Độc</option><option>Minh Giáo</option><option>Võ Đang</option><option>Côn Lôn</option>
      </select>
      <button type="submit">Tạo nhân vật</button>
    </form>
  </div>
  <div id="man-hinh-game" hidden>
    <canvas id="game" width="960" height="600"></canvas>
    <div id="hud">
      <div id="hud-ten"></div>
      <div class="thanh"><div id="thanh-mau" class="mau"></div></div>
      <div class="thanh"><div id="thanh-mana" class="mana"></div></div>
      <div id="hud-thong-tin"></div>
    </div>
    <div id="thanh-ky-nang"></div>
    <div id="chat"><div id="chat-noi-dung"></div><input id="chat-nhap" placeholder="Nhắn..."></div>
  </div>
</div>
<script>
// Dang nhap du phong (khong phu thuoc module): neu main.js khong chay duoc
// vi bat ky ly do gi (1 file import loi, mang chan...), form van dang nhap
// duoc thay vi submit GET ve /? . Main.js se khong gan them handler neu
// co nay da gan (co window.__dnDaGan).
(function () {
  var form = document.getElementById("form-dang-nhap");
  var loi = document.getElementById("dn-loi");
  function hienLoi(msg) { if (loi) loi.textContent = msg || ""; }
  if (!form) return;
  window.__dnDaGan = true;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    hienLoi("");
    var ten = document.getElementById("dn-ten").value.trim();
    var mk = document.getElementById("dn-mk").value;
    fetch("/api/dang-nhap", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ten: ten, mk: mk }), credentials: "same-origin" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok && d.ok !== false, d: d }; }); })
      .then(function (kq) {
        if (!kq.ok) { hienLoi(kq.d.loi || "dang nhap that bai"); return; }
        if (window.VL && window.VL.dangNhapXong) { window.VL.dangNhapXong().catch(function (err) { hienLoi(err && err.message ? err.message : String(err)); }); }
        else { location.reload(); }
      })
      .catch(function (err) { hienLoi(err && err.message ? err.message : "khong ket noi duoc may chu"); });
  });
  // Chan doan: sau 5 giay ma main.js van chua chay (window.VL chua co)
  // thi bao ro cho nguoi dung thay vi im lang nhu truoc.
  setTimeout(function () {
    if (!window.VL) hienLoi("Game chua tai duoc (main.js khong chay). Hay tai lai trang; neu van loi, bao lai de kiem tra mang/may chu.");
  }, 5000);
})();
</script>
<script type="module" src="src/game/main.js"></script>
</body>
</html>
